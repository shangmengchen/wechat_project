services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_RUN_MODE: ${APP_RUN_MODE}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      TZ: ${TZ}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_DIR: ${LOG_DIR}
      LOG_APP_FILE: ${LOG_APP_FILE}
      LOG_ACCESS_FILE: ${LOG_ACCESS_FILE}
      LOG_ERROR_FILE: ${LOG_ERROR_FILE}
      LOG_TO_STDOUT: ${LOG_TO_STDOUT}
      LOG_SQL_LEVEL: ${LOG_SQL_LEVEL}
      LOG_SQL_SLOW_MS: ${LOG_SQL_SLOW_MS}
      LOG_INCLUDE_SOURCE: ${LOG_INCLUDE_SOURCE}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_admin_password}
      ADMIN_TITLE: ${ADMIN_TITLE:-Couple Mini Admin}
      ADMIN_SAMPLE_INTERVAL_SEC: ${ADMIN_SAMPLE_INTERVAL_SEC:-5}
      ADMIN_HISTORY_LIMIT: ${ADMIN_HISTORY_LIMIT:-120}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CREATE_DATABASE: ${MYSQL_CREATE_DATABASE}
      MYSQL_AUTO_MIGRATE: ${MYSQL_AUTO_MIGRATE}
      MYSQL_AUTO_SEED: ${MYSQL_AUTO_SEED}
    volumes:
      - ../uploads:/app/uploads
      - ../logs/backend:/app/logs
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10
    profiles:
      - proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../logs/backend/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
